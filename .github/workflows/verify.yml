name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate demo payload
        run: npm run prepare-data

      - name: Confirm generated data is committed
        run: git diff --exit-code -- src/data/generatedDemo.json

      - name: Type-check
        run: npm run typecheck

      - name: Verify decision scenarios
        run: npm run verify
